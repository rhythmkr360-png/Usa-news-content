name: Refresh U.S. military news

on:
  schedule:
    - cron: '19 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-publisher
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch, process and publish eligible stories
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          MAX_AI_ARTICLES: '100'
          MAX_NEW_PER_RUN: '150'
        run: python scripts/update_feed.py
      - name: Push only when feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new articles to publish."
            exit 0
          fi
          git commit -m "news: publish verified feed update"
          git pull --rebase origin main
          git push origin HEAD:main

